<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <script>
    // Apply the saved theme before the page paints
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <header class="top">
      <button id="greeting" class="greeting" type="button" title="Change name"></button>
      <div class="glass theme" role="radiogroup" aria-label="Theme">
        <button type="button" data-theme="system" role="radio">System</button>
        <button type="button" data-theme="light" role="radio">Light</button>
        <button type="button" data-theme="dark" role="radio">Dark</button>
      </div>
    </header>

    <form id="name-form" class="glass name-form" hidden>
      <label for="name">What's your name?</label>
      <div class="row">
        <input id="name" type="text" placeholder="Your name" maxlength="30" autocomplete="given-name" />
        <button type="submit">Save</button>
      </div>
    </form>

    <form id="search" class="glass search" autocomplete="off">
      <input id="city" type="text" placeholder="Search city…" aria-label="Search city" />
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <section class="glass current">
      <h1 id="place">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="desc" class="desc">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass">
      <h2>Hourly forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-day forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <section class="details">
      <div class="glass tile"><h2>Feels like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV index</h2><p id="uv">--</p></div>
    </section>

    <p class="credit">Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
